plugins {
    id 'com.android.application'
}

android {
    namespace 'id.sus.ruangkirim'
    compileSdk 35

    defaultConfig {
        applicationId 'id.sus.ruangkirim'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // tanpa signingConfig: Pabrik SuS yang menandatangani APK
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // tampilan lokal (WebViewAssetLoader)
    implementation 'androidx.webkit:webkit:1.12.1'
    // pemindai QR dari Layanan Google Play (tanpa izin kamera)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
